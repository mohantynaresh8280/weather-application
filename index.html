<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Station — Live Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================= ICON SYMBOLS ============================= -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-sun" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="24" y1="2" x2="24" y2="9"/>
        <line x1="24" y1="39" x2="24" y2="46"/>
        <line x1="2" y1="24" x2="9" y2="24"/>
        <line x1="39" y1="24" x2="46" y2="24"/>
        <line x1="8.6" y1="8.6" x2="13.6" y2="13.6"/>
        <line x1="34.4" y1="34.4" x2="39.4" y2="39.4"/>
        <line x1="8.6" y1="39.4" x2="13.6" y2="34.4"/>
        <line x1="34.4" y1="13.6" x2="39.4" y2="8.6"/>
      </g>
    </symbol>
    <symbol id="ic-moon" viewBox="0 0 48 48">
      <path d="M30 6 A16 16 0 1 0 30 42 A12 12 0 1 1 30 6 Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="38" cy="10" r="1.4" fill="currentColor"/>
      <circle cx="42" cy="18" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ic-cloud" viewBox="0 0 48 48">
      <path d="M14 32 a8 8 0 0 1 -1-15.9 A10 10 0 0 1 32 13 a8 8 0 0 1 3 15.9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-fog" viewBox="0 0 48 48">
      <path d="M14 24 a8 8 0 0 1 -1-15.9 A10 10 0 0 1 32 5 a8 8 0 0 1 3 15.9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="6" y1="32" x2="42" y2="32"/>
        <line x1="10" y1="38" x2="38" y2="38"/>
        <line x1="14" y1="44" x2="34" y2="44"/>
      </g>
    </symbol>
    <symbol id="ic-rain" viewBox="0 0 48 48">
      <path d="M14 26 a8 8 0 0 1 -1-15.9 A10 10 0 0 1 32 7 a8 8 0 0 1 3 15.9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="16" y1="34" x2="13" y2="42"/>
        <line x1="25" y1="34" x2="22" y2="42"/>
        <line x1="34" y1="34" x2="31" y2="42"/>
      </g>
    </symbol>
    <symbol id="ic-snow" viewBox="0 0 48 48">
      <path d="M14 24 a8 8 0 0 1 -1-15.9 A10 10 0 0 1 32 5 a8 8 0 0 1 3 15.9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="15" y1="32" x2="15" y2="42"/>
        <line x1="10.5" y1="34.5" x2="19.5" y2="39.5"/>
        <line x1="19.5" y1="34.5" x2="10.5" y2="39.5"/>
        <line x1="33" y1="32" x2="33" y2="42"/>
        <line x1="28.5" y1="34.5" x2="37.5" y2="39.5"/>
        <line x1="37.5" y1="34.5" x2="28.5" y2="39.5"/>
      </g>
    </symbol>
    <symbol id="ic-storm" viewBox="0 0 48 48">
      <path d="M14 22 a8 8 0 0 1 -1-15.9 A10 10 0 0 1 32 3 a8 8 0 0 1 3 15.9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M25 26 L18 36 L24 36 L20 45 L32 32 L25 32 Z" fill="currentColor" stroke="none"/>
    </symbol>
  </defs>
</svg>

<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="brand-eyebrow mono">STATION LOG</span>
      <span class="brand-name serif">Weather Station</span>
    </div>
    <div class="search-wrap">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Search a city or station…"
          autocomplete="off"
          aria-label="Search city"
        />
        <button class="icon-btn" id="locateBtn" title="Use current location" aria-label="Use current location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>

  <div id="main">
    <div class="status-msg fade-in">
      <span class="mono">Reading instruments…</span>
      Loading current conditions.
    </div>
  </div>

  <footer class="credit">
    Readings via <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · built with plain HTML, CSS &amp; JavaScript
  </footer>
</div>

<script src="script.js"></script>

</body>
</html>
